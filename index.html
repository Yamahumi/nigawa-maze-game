<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="メイズチェイス">
  <meta name="theme-color" content="#0d1b3a">
  <meta name="format-detection" content="telephone=no">
  <title>メイズチェイス</title>
  <script>document.documentElement.classList.toggle("landscape", window.innerWidth > window.innerHeight);</script>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header id="hud" hidden>
      <div class="hud-block">
        <div class="hud-label">てんすう</div>
        <div id="score" class="hud-value">0</div>
      </div>
      <div class="hud-block hud-center">
        <div id="stage-name" class="hud-stage"></div>
        <div id="message" class="hud-msg"></div>
        <div id="bike-hud" hidden>
          <div class="bike-label">じてんしゃ！</div>
          <div class="bike-bar"><i></i></div>
        </div>
      </div>
      <div class="hud-block hud-right">
        <div class="hud-label">のこり</div>
        <div id="lives" class="hud-lives"></div>
      </div>
    </header>

    <div id="stage">
      <canvas id="game" width="390" height="520"></canvas>
      <div id="overlay">
        <div id="title-screen" class="panel">
          <img class="title-icon" src="icon-192.png" alt="">
          <h1>メイズチェイス</h1>
          <p class="lead">マップを かけめぐって<br>てきから にげながら<br>エサを あつめよう</p>
          <button type="button" class="btn big" data-start="classic">クラシックステージ</button>
          <button type="button" class="btn big alt" data-start="nigawa">にがわステージ</button>
          <p class="howto">ゆびで スワイプするか<br>したの ボタンで うごかしてね</p>
          <p class="howto small">ホームがめんに ついかすると<br>アプリみたいに あそべるよ</p>
        </div>
        <div id="end-screen" class="panel" hidden>
          <h2 id="end-title"></h2>
          <p id="end-sub" class="lead"></p>
          <p class="end-score">てんすう <span id="end-score">0</span></p>
          <button type="button" class="btn big" id="btn-retry">もういちど</button>
          <button type="button" class="btn big ghost" id="btn-title">タイトルへ</button>
        </div>
      </div>
    </div>

    <nav id="dpad" hidden aria-label="そうさボタン">
      <button type="button" class="pad" data-dir="up" aria-label="うえ">▲</button>
      <div class="pad-mid">
        <button type="button" class="pad" data-dir="left" aria-label="ひだり">◀</button>
        <button type="button" class="pad" data-dir="right" aria-label="みぎ">▶</button>
      </div>
      <button type="button" class="pad" data-dir="down" aria-label="した">▼</button>
    </nav>

    <footer id="attrib">© OpenStreetMap contributors</footer>
  </div>
  <div id="landmark-fx" aria-hidden="true">
    <div class="fx-flash"></div>
    <canvas class="fx-particles"></canvas>
    <div class="fx-label"></div>
  </div>
  <div id="caught-fx" aria-hidden="true">
    <div class="caught-flash"></div>
    <div class="caught-burst">
      <div class="caught-pon">ポン！</div>
    </div>
    <div class="caught-label"></div>
  </div>
  <script src="game.js"></script>
</body>
</html>
